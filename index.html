<script>
// If the ride can't start (a file that won't load, no WebGL, a script error), say so on the loading screen
// instead of leaving "Building…" up for ever. The first message wins: it is usually the most specific.
window.rideFailed = msg => {
  const l = document.getElementById('loading');
  if (!l || l.dataset.failed) return;
  l.dataset.failed = '1'; l.textContent = msg;
  l.style.cssText += ';text-transform:none;letter-spacing:.04em;font-size:14px;padding:0 24px;text-align:center';
};
addEventListener('error', () => rideFailed('The ride could not start. Try reloading the page, or another browser.'));
addEventListener('unhandledrejection', () => rideFailed('The ride could not start. Try reloading the page, or another browser.'));
</script>
<script type="module" onerror="rideFailed('The 3D engine did not load. Check the connection and reload the page.')">
import * as THREE from 'three';
import { Sky } from 'three/addons/objects/Sky.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const V3 = THREE.Vector3;
const $ = id => document.getElementById(id);

/* ---------- helpers ---------- */
let seed = 7;
const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
const hash = (x, y) => { const n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return n - Math.floor(n); };
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y, o = 5) { let s = 0, a = 0.5, f = 1; for (let i = 0; i < o; i++) { s += a * vnoise(x * f, y * f); f *= 2.03; a *= 0.5; } return s; }
function ridged(x, y, o = 4) {       // sharp crests and gullies, for mountains
  let s = 0, a = 0.5, f = 1, prev = 1;
  for (let i = 0; i < o; i++) { let n = 1 - Math.abs(2 * vnoise(x * f, y * f) - 1); n *= n; s += n * a * prev; prev = n; f *= 2.1; a *= 0.5; }
  return s;
}
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const canvas2d = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; };
const addScript = src => new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('missing ' + src)); document.head.append(s); });

/* ---------- photo-scanned surfaces (Poly Haven, CC0) ---------- */
const loadImg = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('missing texture')); i.src = src; });
const TEX = ['asphalt_02_diff_2k', 'asphalt_02_nor_gl_2k', 'leafy_grass_diff_2k', 'leafy_grass_nor_gl_1k', 'rock_face_03_diff_1k', 'gravel_ground_01_diff_1k'];
const readable = img => { try { const [, g] = canvas2d(1, 1); g.drawImage(img, 0, 0, 1, 1); g.getImageData(0, 0, 1, 1); return true; } catch (e) { return false; } };
let imgs = await Promise.all(TEX.map(n => loadImg(`assets/${n}.jpg`))).catch(() => null);
if (!imgs || !readable(imgs[0]) || location.search.includes('embedded')) {
  // Opened straight from disk, a browser won't let a page read image files. Use the embedded copies instead.
  // (The hosted site has no embedded copy, so there a failed texture means the page can't start.)
  try {
    await addScript('assets/textures.js');
    imgs = await Promise.all(TEX.map(n => loadImg(window.RIDE_TEXTURES[n])));
  } catch (err) { rideFailed('The road and grass textures did not load. Check the connection and reload the page.'); throw err; }
}
const [imgAsphalt, imgAsphaltN, imgGrass, imgGrassN, imgRock, imgGravel] = imgs;
const imgTex = (img, srgb) => {
  const t = new THREE.Texture(img); t.wrapS = t.wrapT = THREE.RepeatWrapping;
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = MAX_ANISO; t.needsUpdate = true; return t;
};

/* ---------- renderer ---------- */
const renderer = new THREE.WebGLRenderer({ canvas: $('c'), antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.33;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const MAX_ANISO = renderer.capabilities.getMaxAnisotropy();
$('c').addEventListener('webglcontextlost', e => {
  e.preventDefault(); console.warn('ride: graphics context lost');
  const b = document.createElement('div'); b.id = 'lost'; b.textContent = 'Graphics were reset by the browser. Reloading…';
  b.style.cssText = 'position:fixed;inset:0;display:grid;place-items:center;background:rgba(10,9,8,.8);letter-spacing:.1em;font-size:13px';
  document.body.append(b);
  setTimeout(() => location.reload(), 1500);
});

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(64, innerWidth / innerHeight, 0.05, 9000);
scene.add(camera);
const uPx = { value: innerHeight * Math.min(devicePixelRatio, 2) / (2 * Math.tan(0.6)) };      // metres to pixels at 1 m; kept up to date on resize

/* ---------- sky, sun, haze ---------- */
// ?theme=christmas: the same valley under snow at dusk, with lights in the trees and a few chalets

/* ---------- Christmas sounds, all made here rather than loaded: snow crunching under the tyres, a sleigh going by

let xmas = null;

    const g = ac.createGain(), p = ac.createStereoPanner(), w = ac.createGain(), o = ac.createGain();
    g.connect(p); p.connect(o).connect(ac.destination); p.connect(w).connect(hall); o.gain.value = dry; w.gain.value = wet;
    return { g, p };

    nextSleigh: ac.currentTime + 25 + Math.random() * 20, nextChurch: ac.currentTime + 45 + Math.random() * 30,
    grain: 0, pop: 0, box: { i: 0, t: 0, on: false },

buildRider(pacer, false);
const gapText = () => {                                    // seconds between you: minus when they are ahead, plus when you are

  return (pacer.secs > 0 ? '−' : '+') + (t < 100 ? t + ' s' : Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'));
};
const pacerLabel = () => { $('h-pw2').textContent = 'pacer · ' + pacer.watts + ' W'; $('pacer').textContent = pacer.on ? 'Pacer: ' + pacer.watts + ' W' : 'Pacer: off'; $('pacer').classList.toggle('on', pacer.on); };
const setPacer = on => {
  pacer.on = on;

    if (!pacer.set) { pacer.set = true; pacer.watts = Math.max(50, Math.min(500, Math.round((st.time > 60 ? st.work / st.time : st.power) / 10) * 10)); }
    pacer.gap = 6; pacer.v = st.v; pacer.pw = pacer.watts; pacer.secs = 0;   // a bike length or two up the road, where you can see them
  }
  pacer.rig.visible = on;
  pacerLabel();
};
const setPacerWatts = w => { pacer.watts = Math.max(50, Math.min(500, Math.round(w / 10) * 10)); pacer.set = true; pacerLabel(); };
$('pacer').addEventListener('click', () => setPacer(!pacer.on));
$('pless').addEventListener('click', () => setPacerWatts(pacer.watts - 10));
$('pmore').addEventListener('click', () => setPacerWatts(pacer.watts + 10));
for (const b of $('pwait').children) b.addEventListener('click', () => { pacer.wait = b.dataset.wait === '1'; for (const c of $('pwait').children) c.classList.toggle('on', c === b); });
st.pacer = pacer; st.setPacer = setPacer;                  // for testing
st.pacerReset = () => { if (pacer.on) setPacer(true); };
st.pacerResult = () => {
  if (!pacer.on || st.dist < 100) return '';
  const t = Math.round(Math.abs(pacer.secs)), by = t < 100 ? t + ' s' : Math.floor(t / 60) + ' min ' + (t % 60) + ' s';
  return !t ? `Level with the ${pacer.watts} W pacer` : pacer.secs > 0 ? `The ${pacer.watts} W pacer is ${by} ahead of you` : `You are ${by} ahead of the ${pacer.watts} W pacer`;
};
const tagAt = new V3();                                   // (their watts sit under the gap, bottom left; the amber jersey is the only marker on the road)
function stepPacer(dt) {

  tagAt.copy(pacer.rig.position).add(pp.t); pacer.rig.lookAt(tagAt);
}

/* ---------- ghost: your fastest ride on this course, ridden again beside you ----------
   Every ride is traced as its distance at each whole second. When you stop (or leave) after at least five minutes, and
   the ride was faster on average than the ghost kept for this course, it becomes the new ghost (kept in this browser).
   Turned on, the ghost sets off beside you and replays that ride second by second. Like the pacer it is kept as a gap,
   so skipping along the course carries it with you, and it waits while you are stopped. */
const GHOST_KEY = 'golden-hour-ride-ghost-' + COURSE, GHOST_MIN = 300, GHOST_MAX = 10800;   // five minutes at least, three hours at most
const ghost = { on: false, rec: null, t0: 0, d0: 0, gap: 0, secs: 0, done: false, crank: 0, pose: mkPose(), rig: new THREE.Group(), legs: [] };
buildRider(ghost, true);
const trace = [];                                        // this ride: metres ridden at second 0, 1, 2, ...
let traceId = new Date().toISOString();                  // which ride the trace is, so leaving the tab mid-ride and stopping later updates one ghost
const loadGhost = () => { try { const g = JSON.parse(localStorage.getItem(GHOST_KEY)); return g && Array.isArray(g.d) && g.d.length > GHOST_MIN ? g : null; } catch { return null; } };
let bestGhost = loadGhost();
const ghostKmh = d => (d[d.length - 1] - d[0]) / (d.length - 1) * 3.6;
// keep this ride as the ghost if it is long enough and faster than the one kept; true when it was
const keepGhost = () => {
  if (trace.length - 1 < GHOST_MIN) return false;
  const same = bestGhost && bestGhost.t === traceId;       // this ride is already the ghost: keep the longer trace of it
  if (bestGhost && (same ? trace.length <= bestGhost.d.length : ghostKmh(trace) <= ghostKmh(bestGhost.d))) return false;
  bestGhost = { t: traceId, d: trace.slice() };
  try { localStorage.setItem(GHOST_KEY, JSON.stringify(bestGhost)); } catch {}
  ghostLabel(); return true;
};
addEventListener('pagehide', keepGhost);
document.addEventListener('visibilitychange', () => { if (document.hidden) keepGhost(); });
const ghostLabel = () => {
  const b = $('ghost');
  b.disabled = !bestGhost && !ghost.on;
  b.textContent = ghost.on ? 'Ghost: on' : bestGhost ? 'Ghost: ' + ghostKmh(bestGhost.d).toFixed(1) + ' km/h' : 'Ghost: none yet';
  b.classList.toggle('on', ghost.on);
  b.title = bestGhost
    ? `Your fastest ride here (${Math.round((bestGhost.d.length - 1) / 60)} min on ${new Date(bestGhost.t).toLocaleDateString(undefined, { day: 'numeric', month: 'short' })}), ridden again beside you. Beat it and your ride becomes the ghost.`
    : 'Ride here for five minutes or more, then stop, and your fastest ride comes back as a see-through rider to race.';
};
const setGhost = on => {
  ghost.on = on && !!bestGhost;
  if (ghost.on) { ghost.rec = bestGhost; ghost.t0 = st.time; ghost.d0 = st.dist; ghost.gap = 0; ghost.secs = 0; ghost.done = false; }
  ghost.rig.visible = ghost.on;
  ghostLabel();
  return ghost.on ? 'Ghost on' : 'Ghost off';
};
$('ghost').addEventListener('click', () => setGhost(!ghost.on));
ghostLabel();
st.ghost = ghost; st.setGhost = setGhost; st.keepGhost = keepGhost; st.trace = trace;   // for testing
st.ghostReset = () => { trace.length = 0; traceId = new Date().toISOString(); if (ghost.on) setGhost(true); };
const ghostGapText = () => {                               // as the pacer's gap: minus when the ghost is ahead
  if (ghost.done) return 'done';
  const t = Math.round(Math.abs(ghost.secs)); if (!t) return '0 s';
  return (ghost.secs > 0 ? '−' : '+') + (t < 100 ? t + ' s' : Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'));
};
st.ghostResult = () => {
  if (!ghost.on || st.time - ghost.t0 < 30) return '';
  if (ghost.done) return 'You outlasted your ghost: its ride was shorter than yours';
  const t = Math.round(Math.abs(ghost.secs)), by = t < 100 ? t + ' s' : Math.floor(t / 60) + ' min ' + (t % 60) + ' s';
  return !t ? 'Level with your ghost' : ghost.secs > 0 ? `Your ghost is ${by} ahead of you` : `You are ${by} ahead of your ghost`;
};
function stepGhost(dt) {
  if (!st.stopped) while (trace.length <= st.time && trace.length <= GHOST_MAX) trace.push(Math.round(st.dist * 10) / 10);
  if (!ghost.on || ghost.done) return;
  const d = ghost.rec.d, n = st.time - ghost.t0, i = Math.floor(n);
  if (i >= d.length - 1) { ghost.done = true; ghost.rig.visible = false; return; }   // its ride has run out
  const gd = d[i] + (d[i + 1] - d[i]) * (n - i) - d[0], gv = d[i + 1] - d[i];

  ghost.rig.position.copy(pp.p).addScaledVector(pp.r, LANE + (pacer.on ? 1.6 : 0.9));   // the pacer's line, or beside it when both ride
  tagAt.copy(ghost.rig.position).add(pp.t); ghost.rig.lookAt(tagAt);
}
let lean = 0, phase = 0, grade = 0, huT = 0, first = true;
// scenery mode's weather, in order, and how many seconds each one stays
const SCENE_PLAN = XMAS ? [['snow', 280], ['mist', 100], ['snow', 180], ['golden', 95]] : [['golden', 200], ['mist', 110], ['rain', 130], ['overcast', 70], ['golden', 90]];
let scene_t = 0, scene_i = 0;
// the first time someone opens the ride in this browser, Devices opens by itself as the "get ready" step
try { if (SCENERY === null && !localStorage.getItem('golden-hour-ride-welcomed')) { localStorage.setItem('golden-hour-ride-welcomed', '1'); setDevices(true); } } catch {}

function tick() {

  const force = st.power / Math.max(v, 2) - MASS * 9.81 * (slope + 0.004) - 0.5 * 1.2 * 0.32 * v * v - brake;

    else if (c.mesh && d2 > 330 * 330) { scene.remove(c.mesh); c.mesh.dispose(); c.mesh = null; }
  }

  rays.uniforms.uAmt.value = 0.25 * wx.rays * smooth(0.1, 0.6, camera.getWorldDirection(fwd).dot(sunDir));
  lens.uniforms.uSpeed.value = Math.min(1, st.v / 22);
  lens.uniforms.uTime.value = uTime.value; lens.uniforms.uRain.value = wx.rain; lens.uniforms.uPaint.value = wx.paint;

    const t = audio.ac.currentTime;
    audio.wind.g.gain.setTargetAtTime(Math.min(0.5, st.v * st.v / 400 * 0.35) * coach.duck, t, 0.2);
    audio.wind.f.frequency.setTargetAtTime(300 + st.v * 40, t, 0.2);

  if (first) { first = false; $('loading').style.opacity = 0; setTimeout(() => $('loading').remove(), 900); }
