<style>
  html, body { margin: 0; height: 100%; background: #0b0a09; overflow: hidden; }

  #wohud .top, #wohud .foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 12px; }

  #wohud .nums b { display: block; font-size: 28px; font-weight: 300; }
  #wohud .nums span { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; opacity: .7; }
  #wohud canvas { display: block; width: 100%; height: 56px; margin-bottom: 8px; }

    box-shadow: 0 6px 24px rgba(0,0,0,.35); pointer-events: none; overflow: hidden; }

    background: linear-gradient(transparent, rgba(0,0,0,.65)); text-shadow: 0 1px 3px rgba(0,0,0,.6); }

<body>

<script>
// If the ride can't start (a file that won't load, no WebGL, a script error), say so on the loading screen
// instead of leaving "Building…" up for ever. The first message wins: it is usually the most specific.
window.rideFailed = msg => {
  const l = document.getElementById('loading');
  if (!l || l.dataset.failed) return;
  l.dataset.failed = '1'; l.textContent = msg;
  l.style.cssText += ';text-transform:none;letter-spacing:.04em;font-size:14px;padding:0 24px;text-align:center';
};
addEventListener('error', () => rideFailed('The ride could not start. Try reloading the page, or another browser.'));
addEventListener('unhandledrejection', () => rideFailed('The ride could not start. Try reloading the page, or another browser.'));
</script>
<script type="module" onerror="rideFailed('The 3D engine did not load. Check the connection and reload the page.')">
import * as THREE from 'three';
import { Sky } from 'three/addons/objects/Sky.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const V3 = THREE.Vector3;
const $ = id => document.getElementById(id);

/* ---------- helpers ---------- */
let seed = 7;
const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
const hash = (x, y) => { const n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return n - Math.floor(n); };
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y, o = 5) { let s = 0, a = 0.5, f = 1; for (let i = 0; i < o; i++) { s += a * vnoise(x * f, y * f); f *= 2.03; a *= 0.5; } return s; }
function ridged(x, y, o = 4) {       // sharp crests and gullies, for mountains
  let s = 0, a = 0.5, f = 1, prev = 1;
  for (let i = 0; i < o; i++) { let n = 1 - Math.abs(2 * vnoise(x * f, y * f) - 1); n *= n; s += n * a * prev; prev = n; f *= 2.1; a *= 0.5; }
  return s;
}
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const canvas2d = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; };
const addScript = src => new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('missing ' + src)); document.head.append(s); });

/* ---------- photo-scanned surfaces (Poly Haven, CC0) ---------- */
const loadImg = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('missing texture')); i.src = src; });
const TEX = ['asphalt_02_diff_2k', 'asphalt_02_nor_gl_2k', 'leafy_grass_diff_2k', 'leafy_grass_nor_gl_1k', 'rock_face_03_diff_1k', 'gravel_ground_01_diff_1k'];
const readable = img => { try { const [, g] = canvas2d(1, 1); g.drawImage(img, 0, 0, 1, 1); g.getImageData(0, 0, 1, 1); return true; } catch (e) { return false; } };
let imgs = await Promise.all(TEX.map(n => loadImg(`assets/${n}.jpg`))).catch(() => null);
if (!imgs || !readable(imgs[0]) || location.search.includes('embedded')) {
  // Opened straight from disk, a browser won't let a page read image files. Use the embedded copies instead.
  // (The hosted site has no embedded copy, so there a failed texture means the page can't start.)
  try {
    await addScript('assets/textures.js');
    imgs = await Promise.all(TEX.map(n => loadImg(window.RIDE_TEXTURES[n])));
  } catch (err) { rideFailed('The road and grass textures did not load. Check the connection and reload the page.'); throw err; }
}
const [imgAsphalt, imgAsphaltN, imgGrass, imgGrassN, imgRock, imgGravel] = imgs;
const imgTex = (img, srgb) => {
  const t = new THREE.Texture(img); t.wrapS = t.wrapT = THREE.RepeatWrapping;
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = MAX_ANISO; t.needsUpdate = true; return t;
};

/* ---------- renderer ---------- */
const renderer = new THREE.WebGLRenderer({ canvas: $('c'), antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.33;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const MAX_ANISO = renderer.capabilities.getMaxAnisotropy();
$('c').addEventListener('webglcontextlost', e => {
  e.preventDefault(); console.warn('ride: graphics context lost');
  const b = document.createElement('div'); b.id = 'lost'; b.textContent = 'Graphics were reset by the browser. Reloading…';
  b.style.cssText = 'position:fixed;inset:0;display:grid;place-items:center;background:rgba(10,9,8,.8);letter-spacing:.1em;font-size:13px';
  document.body.append(b);
  setTimeout(() => location.reload(), 1500);
});

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(64, innerWidth / innerHeight, 0.05, 9000);
scene.add(camera);
const uPx = { value: innerHeight * Math.min(devicePixelRatio, 2) / (2 * Math.tan(0.6)) };      // metres to pixels at 1 m; kept up to date on resize

/* ---------- sky, sun, haze ---------- */
// ?theme=christmas: the same valley under snow at dusk, with lights in the trees and a few chalets
const XMAS = new URLSearchParams(location.search).get('theme') === 'christmas' && new URLSearchParams(location.search).get('course') !== 'leckhampton';
const SUN_ELEV = XMAS ? 4.5 : 11, SUN_AZ = -24;
const sunDir = new V3().setFromSphericalCoords(1, THREE.MathUtils.degToRad(90 - SUN_ELEV), THREE.MathUtils.degToRad(SUN_AZ));
const sunFlat = new V3(sunDir.x, 0, sunDir.z).normalize();

const sky = new Sky();
sky.scale.setScalar(450000);
Object.assign(sky.material.uniforms.turbidity, { value: XMAS ? 5 : 7 });
Object.assign(sky.material.uniforms.rayleigh, { value: XMAS ? 3.2 : 2.2 });
Object.assign(sky.material.uniforms.mieCoefficient, { value: 0.004 });
Object.assign(sky.material.uniforms.mieDirectionalG, { value: 0.82 });
sky.material.uniforms.sunPosition.value.copy(sunDir);

const envScene = new THREE.Scene();
envScene.add(sky);
const pmrem = new THREE.PMREMGenerator(renderer);
let envRT = pmrem.fromScene(envScene);
scene.environment = envRT.texture;

// Read the sky's own horizon colour so the haze melts into it.
function sampleSky(dir) {
  const rt = new THREE.WebGLRenderTarget(4, 4, { type: THREE.FloatType });
  const cam = new THREE.PerspectiveCamera(2, 1, 0.1, 10);
  cam.lookAt(dir);
  renderer.setRenderTarget(rt);
  renderer.render(envScene, cam);
  const px = new Float32Array(64);
  renderer.readRenderTargetPixels(rt, 0, 0, 4, 4, px);
  renderer.setRenderTarget(null);
  rt.dispose();
  const ok = isFinite(px[0]) && px[0] + px[1] + px[2] > 0.01;
  return ok ? new THREE.Color(px[0], px[1], px[2]) : new THREE.Color(0.9, 0.62, 0.42);
}
const hazeDir = new V3().setFromSphericalCoords(1, THREE.MathUtils.degToRad(88), THREE.MathUtils.degToRad(SUN_AZ + 55));
const hazeCol = sampleSky(hazeDir);
scene.add(sky);
scene.fog = new THREE.FogExp2(hazeCol, 0.0007);

const sun = new THREE.DirectionalLight(0xffb070, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -110, right: 110, top: 110, bottom: -110, near: 1, far: 700 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.6;
scene.add(sun, sun.target);
const hemi = new THREE.HemisphereLight(XMAS ? 0xa6b4ea : 0xa9b8ee, XMAS ? 0x9aa2b6 : 0x6b563a, 2.2);
scene.add(hemi);

/* ---------- course: the invented valley, or a real road built from survey data ---------- */
const COURSE = new URLSearchParams(location.search).get('course') === 'leckhampton' ? 'leckhampton' : 'valley';
// Scenery mode (?scenery): the ride drifts along on its own at a gentle pace with nothing on screen and the weather
// slowly changing, for leaving on in the background. ?scenery=nobars also hides the handlebars.
const SCENERY = new URLSearchParams(location.search).get('scenery');
let real = null;
if (COURSE !== 'valley') {
  $('loading').textContent = 'Building Leckhampton Hill…';
  const DATA = 3;          // bump when the course files change, so browsers don't reuse an old copy
  try { await addScript(`assets/${COURSE}.js?v=${DATA}`); }
  catch (err) { rideFailed('The Leckhampton course did not load. Check the connection and reload the page.'); throw err; }
  await addScript(`assets/${COURSE}_osm.js?v=${DATA}`).catch(() => {});          // buildings, woods and hedges are optional
  real = window.RIDE_COURSES[COURSE];
  real.osm = real.osm || { buildings: [], trees: [], lines: [], woods: '', credit: '' };
  const wb = Uint8Array.from(atob(real.osm.woods), c => c.charCodeAt(0));
  real.wood = (x, z) => {                 // is this spot mapped as woodland?
    const g = real.cells, ix = Math.round((x + real.size / 2) / (real.size / g)), iz = Math.round((z + real.size / 2) / (real.size / g));
    if (ix < 0 || iz < 0 || ix > g || iz > g) return false;
    const i = iz * (g + 1) + ix; return ((wb[i >> 3] >> (i & 7)) & 1) === 1;
  };
  const raw = Uint8Array.from(atob(real.dem), c => c.charCodeAt(0)), q = new Uint16Array(raw.buffer);
  real.h = Float32Array.from(q, v => real.demMin + v / 65535 * (real.demMax - real.demMin));     // surveyed ground heights, metres
  $('credit').textContent = real.credit + ' ' + real.osm.credit;
}
$('course').textContent = real ? 'Course: Leckhampton' : 'Course: Valley';
$('course').addEventListener('click', () => { location.search = real ? '' : '?course=leckhampton'; });
function demH(x, z) {                 // the real ground under a point
  const g = real.cells, w = g + 1, f = v => Math.min(g - 1e-6, Math.max(0, (v + real.size / 2) / (real.size / g)));
  const fx = f(x), fz = f(z), ix = Math.floor(fx), iz = Math.floor(fz), u = fx - ix, v = fz - iz, h = real.h;
  return (h[iz * w + ix] * (1 - u) + h[iz * w + ix + 1] * u) * (1 - v) + (h[(iz + 1) * w + ix] * (1 - u) + h[(iz + 1) * w + ix + 1] * u) * v;
}

const st0 = {};        // build counts, for checking

/* ---------- the road line ---------- */
const ctrl = [];
if (real) for (const p of real.road) ctrl.push(new V3(p[0], p[1], p[2]));
else for (let i = 0; i < 22; i++) {
  const a = i / 22 * Math.PI * 2;
  const r = 430 + 110 * Math.sin(a * 3 + 0.6) + 60 * Math.sin(a * 5 + 2.1);
  ctrl.push(new V3(Math.cos(a) * r, 40 + 16 * Math.sin(a * 2 + 1) + 4 * Math.sin(a * 5), Math.sin(a) * r));
}
const curve = new THREE.CatmullRomCurve3(ctrl, true, 'centripetal');
curve.arcLengthDivisions = Math.max(4000, ctrl.length * 12);
const LEN = curve.getLength();
const N = Math.floor(LEN / 1.5);
const P = curve.getSpacedPoints(N).slice(0, N);
const T = P.map((_, i) => new V3().subVectors(P[(i + 1) % N], P[(i - 1 + N) % N]).normalize());
const R = T.map(t => new V3(-t.z, 0, t.x).normalize());

function at(s, out) {
  const f = (((s % LEN) + LEN) % LEN) / LEN * N;
  const i = Math.floor(f) % N, j = (i + 1) % N, k = f - Math.floor(f);
  out.p.lerpVectors(P[i], P[j], k);
  out.t.lerpVectors(T[i], T[j], k).normalize();
  out.r.set(-out.t.z, 0, out.t.x).normalize();

/* ---------- buildings, hedges and walls (real courses) ---------- */

/* Smart trainer. Power is read from the Cycling Power service. If the trainer also has the Fitness Machine
   Service (FTMS), the game takes control of it and sends the road gradient, so climbs feel harder on the bike.
   Bkool trainers without FTMS (the Smart Pro 3, sold by Zycle as the Smart ZPro) take ANT+ FE-C data pages, bare,
   on a Bkool characteristic instead: the format comes from a recording of Kinomap driving one.
   Without either, or if the trainer refuses control, it stays power only. */
const FTMS = 0x1826, FTMS_POINT = 0x2AD9;          // service, and its Fitness Machine Control Point
const BKOOL = 'f03eee01-4910-473c-be46-960948c2f59c', BKOOL_CMD = 'f03ee002-4910-473c-be46-960948c2f59c', BKOOL_DATA = 'f03ee006-4910-473c-be46-960948c2f59c';

const bkoolGrade = g => { const v = Math.round((g + 200) / 0.01); return Uint8Array.from([0x33, 0x6f, 0xff, 0xff, 0xff, v & 255, v >> 8, 0x00]); };
const OP_POWER = 0x05;                               // FTMS: Set Target Power, sint16 watts
const OP_CONTROL = 0x00, OP_SIM = 0x11, OP_REPLY = 0x80, OP_OK = 0x01;
const bike = { dev: null, known: null, point: null, busy: false, sent: 0, at: 0, fails: 0, timer: 0, tries: 0 };
// How much of the road's gradient the trainer is asked to feel. Half by default, like most indoor games,
// so a 10 % climb pedals like 5 %; descents count half again. ?hills=100 gives the full gradient, ?hills=0 none.
const HILLS_KEY = 'golden-hour-ride-hills';         // kept in this browser; ?hills= sets it for one visit
let HILLS = (() => {
  const q = new URLSearchParams(location.search).get('hills');
  let n = 50; try { const k = localStorage.getItem(HILLS_KEY); if (k !== null && isFinite(+k)) n = +k; } catch {}
  if (q !== null && q !== '' && isFinite(+q)) n = +q;
  return Math.max(0, Math.min(100, n)) / 100;
})();
const setHills = (pct, keep = true) => {          // keep: remember it in this browser (not for a one-visit ?hills=)
  HILLS = Math.max(0, Math.min(100, Math.round(pct / 10) * 10)) / 100;
  if (keep) try { localStorage.setItem(HILLS_KEY, String(Math.round(HILLS * 100))); } catch {}
  $('hval').textContent = HILLS ? 'Hills ' + Math.round(HILLS * 100) + ' %' : 'Hills off';
  bike.at = 0;                                      // tell the trainer straight away
};
const TRAINER_KEY = 'golden-hour-ride-trainer';     // the last trainer used: { id, name }, kept in this browser
const lastTrainer = () => { try { return JSON.parse(localStorage.getItem(TRAINER_KEY)) || null; } catch { return null; } };
const btLabel = () => {
  const last = lastTrainer();
  $('bt').textContent = bike.dev ? (bike.point ? 'Trainer: power and gradient' : 'Trainer: power only')
    : bike.known || (last && navigator.bluetooth && navigator.bluetooth.getDevices) ? 'Reconnect trainer' : 'Connect trainer';

$('hless').addEventListener('click', () => setHills(HILLS * 100 - 10));

// write one command to the control point and wait for the trainer's reply to it
const ftmsAsk = (point, bytes) => new Promise((ok, no) => {
  const end = () => { clearTimeout(t); point.removeEventListener('characteristicvaluechanged', reply); };
  const reply = e => {
    const d = e.target.value;
    if (d.byteLength < 3 || d.getUint8(0) !== OP_REPLY || d.getUint8(1) !== bytes[0]) return;
    end(); d.getUint8(2) === OP_OK ? ok() : no(new Error('trainer refused'));
  };
  const t = setTimeout(() => { end(); no(new Error('no reply from trainer')); }, 3000);
  point.addEventListener('characteristicvaluechanged', reply);
  point.writeValueWithResponse(Uint8Array.from(bytes)).catch(err => { end(); no(err); });
});

// Indoor Bike Simulation Parameters: wind, gradient, rolling resistance and drag, matching the ride's own physics.
// (FTMS has no rider weight here; the trainer uses the weight set in its own app, the game uses MASS.)
function simParams(gradePct) {
  const d = new DataView(new ArrayBuffer(7));
  d.setUint8(0, OP_SIM);
  d.setInt16(1, 0, true);                                   // wind speed, 0.001 m/s
  d.setInt16(3, Math.round(gradePct * 100), true);          // gradient, 0.01 %
  d.setUint8(5, Math.round(0.004 / 0.0001));                // rolling resistance, 0.0001
  d.setUint8(6, Math.round(0.5 * 1.2 * 0.32 / 0.01));       // drag (half rho CdA), 0.01 kg/m
  return d;
}

// about once a second, or sooner when the gradient has moved by more than 0.5 %
// In a workout step with a power target (and ERG on), the trainer is asked to hold that power instead.
// The Bkool does not hold a power when asked to (FE-C page 49 made it lighter, not heavier), but it does follow the
// gradient. So hold the power through the gradient: with the rider and bike weight it was given, and no wind or rolling
// resistance, power = mass × g × speed × slope. The trainer reports its speed every 2 s; a slow correction from the power
// you actually make covers the trainer's own losses.
function ergGrade(target) {
  const v = Math.max(3, bike.speed || 0), wPerPct = MASS * 9.81 * v / 100;         // watts for each 1 % of slope at this speed
  const now = performance.now(), dt = Math.min(2, (now - (bike.ergAt || now)) / 1000); bike.ergAt = now;
  if (st.power > 20 && performance.now() - (bike.ergSince || 0) > 4000)            // not while the trainer is still reacting to a new target
    bike.ergI = Math.max(-6, Math.min(6, (bike.ergI || 0) + (target - wo.avg) / wPerPct * 0.3 * dt));
  return Math.max(-5, Math.min(20, target / wPerPct + (bike.ergI || 0)));
}
async function sendGrade() {
  const now = performance.now(), wait = now - bike.at, watts = workoutWatts(), road = workoutGrade() ?? grade;
  let mode = watts === null ? 'sim' : 'erg', val;
  if (mode === 'erg' && bike.kind === 'bkool') {                                     // a power target, held through the gradient
    mode = 'erg-slope';
    if (watts !== bike.ergTarget) { bike.ergTarget = watts; bike.ergSince = now; }
    val = ergGrade(watts);
  } else val = mode === 'erg' ? watts : Math.max(-20, Math.min(20, road)) * (road > 0 ? HILLS : HILLS * 0.5);
  if (!bike.point || bike.busy || wait < 250) return;
  if (mode === bike.mode && wait < 1000 && Math.abs(val - bike.sent) <= (mode === 'erg' ? 1 : mode === 'erg-slope' ? 0.15 : 0.5)) return;
  bike.busy = true; bike.at = now;
  const point = bike.point;
  try {
    if (bike.kind === 'bkool') await point.writeValueWithoutResponse(bkoolGrade(val));
    else await point.writeValueWithResponse(mode === 'erg' ? Uint8Array.from([OP_POWER, val & 255, (val >> 8) & 255]) : simParams(val));
    bike.sent = val; bike.mode = mode; bike.fails = 0;
  }
  catch (err) {
    // three misses in a row: give up on gradient and carry on with power only
    if (bike.point === point && ++bike.fails >= 3) { bike.point = null; clearInterval(bike.timer); btLabel(); }
  }
  bike.busy = false;
}

// take control of the trainer's resistance: FTMS if it has it, otherwise Bkool's own channel, otherwise power only
async function ftmsStart(server) {
  clearInterval(bike.timer);
  let point = null, kind = null;
  try {
    point = await (await server.getPrimaryService(FTMS)).getCharacteristic(FTMS_POINT);
    await point.startNotifications();
    await ftmsAsk(point, [OP_CONTROL]);
    kind = 'ftms';
  } catch (err) {}
  if (!kind) try {
    point = await (await server.getPrimaryService(BKOOL)).getCharacteristic(BKOOL_CMD);
    const kg = Math.round(RIDER_KG * 100), bk = Math.round(BIKE_KG / 0.05);            // rider in 0.01 kg, bike in 0.05 kg
    await point.writeValueWithoutResponse(Uint8Array.from([0x37, kg & 255, kg >> 8, 0xff, ((bk & 15) << 4) | 0x08, bk >> 4, 0xff, 0xff]));   // page 55: rider and bike weight
    await point.writeValueWithoutResponse(Uint8Array.from([0x32, 0x6f, 0xff, 0xff, 0xff, 0x00, 0x7f, 0x64]));          // page 50: no wind
    kind = 'bkool';
    try {                                                   // Bkool's own data, every 2 s: power, speed, and cadence in byte 4 (rpm)
      const data = await (await server.getPrimaryService(BKOOL)).getCharacteristic(BKOOL_DATA);
      await data.startNotifications();
      data.addEventListener('characteristicvaluechanged', e => {
        const d = e.target.value; if (d.byteLength < 5) return;
        setCadence(d.getUint8(4));
        bike.speed = d.getUint16(2, true) / 100 / 3.6;      // bytes 2-3: the trainer's speed in 0.01 km/h, here in m/s
      });
    } catch (err) {}                                        // no cadence, but the trainer still works
  } catch (err) {}
  if (!kind) { bike.point = null; return; }                // no way to control it: power only
  Object.assign(bike, { point, kind, busy: false, sent: 0, at: 0, fails: 0 });
  bike.timer = setInterval(sendGrade, 250);
}

// give up on a slow Bluetooth step instead of hanging on it
const within = (p, ms) => new Promise((ok, no) => { const t = setTimeout(() => no(new Error('timed out')), ms); p.then(v => { clearTimeout(t); ok(v); }, e => { clearTimeout(t); no(e); }); });
const watched = new WeakSet();

// Power comes from the Cycling Power service; a trainer that only has FTMS reports it in Indoor Bike Data instead.
const FTMS_BIKE = 0x2AD2;
function ftmsPower(d) {              // Indoor Bike Data: flags, then only the fields the flags say are present, in this order
  if (d.byteLength < 2) return null;
  const f = d.getUint16(0, true);
  if (!(f & 0x40)) return null;                                     // no instantaneous power in this message
  let o = 2;
  if (!(f & 0x01)) o += 2;                                          // instantaneous speed (present when bit 0 is clear)
  for (const [bit, size] of [[0x02, 2], [0x04, 2], [0x08, 2], [0x10, 3], [0x20, 2]]) if (f & bit) o += size;   // avg speed, cadence, avg cadence, distance, resistance
  return o + 2 <= d.byteLength ? d.getInt16(o, true) : null;
}
// Cadence, when the trainer or power meter reports it: FTMS gives rpm directly, Cycling Power gives a crank
// revolution count and the time of the last one, so cadence comes from the change between messages.
const setCadence = rpm => { st.cad = Math.round(Math.max(0, Math.min(250, rpm))); st.cadAt = performance.now(); };
function cadenceNow() { return st.cad == null ? null : performance.now() - st.cadAt > 5000 ? 0 : st.cad; }   // nothing new for 5 s: stopped
function ftmsCadence(d) {
  if (d.byteLength < 2) return;
  const f = d.getUint16(0, true);
  if (!(f & 0x04)) return;                                           // no instantaneous cadence in this message
  const o = 2 + (f & 0x01 ? 0 : 2) + (f & 0x02 ? 2 : 0);              // after instantaneous and average speed
  if (o + 2 <= d.byteLength) setCadence(d.getUint16(o, true) / 2);    // 0.5 rpm units
}
const crank = { revs: null, time: 0, at: 0 };
function cpsCadence(d) {
  const f = d.getUint16(0, true);

  let o = 4;
  if (f & 0x01) o += 1; if (f & 0x04) o += 2; if (f & 0x10) o += 6;   // pedal balance, torque, wheel revolutions come first
  if (o + 4 > d.byteLength) return;
  const revs = d.getUint16(o, true), time = d.getUint16(o + 2, true), now = performance.now();

  let ch = null;
  try { ch = await (await server.getPrimaryService('cycling_power')).getCharacteristic('cycling_power_measurement'); } catch {}

    await ch.startNotifications();
    ch.addEventListener('characteristicvaluechanged', e => { st.trainer = true; setTarget(e.target.value.getInt16(2, true)); cpsCadence(e.target.value); });
    return;
  }
  ch = await (await server.getPrimaryService(FTMS)).getCharacteristic(FTMS_BIKE);
  await ch.startNotifications();
  ch.addEventListener('characteristicvaluechanged', e => { const w = ftmsPower(e.target.value); ftmsCadence(e.target.value); if (w !== null) { st.trainer = true; setTarget(w); } });

// connect to one trainer and start reading its power (and sending gradient, if it allows)
async function useTrainer(dev) {
  let server;
  try { server = await within(dev.gatt.connect(), 8000); await readPower(server); }
  catch (err) { try { dev.gatt.disconnect(); } catch {} throw err; }      // don't leave a half-set-up trainer connected
  if (!watched.has(dev)) {
    watched.add(dev);
    dev.addEventListener('gattserverdisconnected', () => {
      const wasInUse = bike.dev === dev;            // not a trainer we dropped ourselves because it failed to set up
      st.trainer = false; clearInterval(bike.timer); bike.dev = bike.point = null; btLabel();
      if (wasInUse) rejoin(dev);
    });
  }
  bike.dev = bike.known = dev; bike.tries = 0; $('bt').title = dev.name || '';
  try { localStorage.setItem(TRAINER_KEY, JSON.stringify({ id: dev.id, name: dev.name || '' })); } catch {}
  await ftmsStart(server);
  if (dev.gatt.connected) btLabel();
}

// the trainer dropped out (out of range, asleep, a blip): try it again a few times before giving up
async function rejoin(dev) {
  while (!bike.dev && bike.known === dev && bike.tries < 6) {
    bike.tries++; $('bt').textContent = 'Reconnecting…';
    await new Promise(r => setTimeout(r, 2500));
    if (bike.dev || bike.known !== dev) return;
    try { await useTrainer(dev); return; } catch (err) { clearInterval(bike.timer); bike.dev = bike.point = null; }
  }
  btLabel();
}

// trainers this browser already has permission for, the one used last first
async function knownTrainers() {
  const list = bike.known ? [bike.known] : [], last = lastTrainer();
  if (navigator.bluetooth.getDevices) {
    try { for (const d of await navigator.bluetooth.getDevices()) if (!list.includes(d)) (last && d.id === last.id ? list.unshift(d) : list.push(d)); } catch {}
  }
  return list;
}

$('bt').addEventListener('click', async () => {
  if (!navigator.bluetooth) { $('bt').textContent = 'Needs Chrome or Edge'; return; }
  if (bike.busyJoin) return;
  bike.busyJoin = true; bike.tries = 99;                    // a click takes over from any automatic retry
  try {
    if (!bike.dev) {
      for (const dev of await knownTrainers()) {
        $('bt').textContent = 'Reconnecting…';
        try { await useTrainer(dev); return; } catch (err) { clearInterval(bike.timer); bike.dev = bike.point = null; }
      }
    }
    // nothing remembered, or it did not answer: show the browser's list of trainers nearby
    btLabel();
    const dev = await navigator.bluetooth.requestDevice({ filters: [{ services: ['cycling_power'] }, { services: [FTMS] }], optionalServices: ['cycling_power', FTMS, BKOOL] });
    $('bt').textContent = 'Connecting…';
    if (bike.dev && bike.dev !== dev) { const old = bike.dev; bike.known = dev; try { old.gatt.disconnect(); } catch {} }
    await useTrainer(dev);
  } catch (err) { if (!bike.dev) { clearInterval(bike.timer); bike.point = null; } btLabel(); }
  finally { bike.busyJoin = false; }
});

/* ---------- heart-rate monitor: the standard Bluetooth Heart Rate service, any chest strap or armband ---------- */
const HR_KEY = 'golden-hour-ride-hrm';                // the last monitor used: { id, name }, kept in this browser
const hrm = { dev: null, bpm: null, at: 0, busy: false, tries: 0 };
function hrNow() { return hrm.bpm == null || performance.now() - hrm.at > 5000 ? null : hrm.bpm; }   // nothing for 5 s: no reading
function showHr(el, hr) {                              // the number, and a heart that beats at that rate (faded with no reading)
  el.textContent = hr === null ? '–' : hr;
  el.classList.toggle('live', hr !== null);
  if (hr !== null) el.style.setProperty('--beat', (60 / hr).toFixed(2) + 's');
}
const hrLabel = t => { $('hrbtn').textContent = t || (hrm.dev ? 'Heart rate: on' : 'Heart rate'); $('hrbtn').classList.toggle('on', !!hrm.dev); };
function hrParse(d) {                                  // flags, then the rate as one byte, or two when bit 0 is set
  if (d.byteLength < 2) return;

}
async function useHrm(dev) {
  let server;
  try {
    server = await within(dev.gatt.connect(), 8000);
    const ch = await (await server.getPrimaryService('heart_rate')).getCharacteristic('heart_rate_measurement');
    await ch.startNotifications();
    ch.addEventListener('characteristicvaluechanged', e => hrParse(e.target.value));
  } catch (err) { try { dev.gatt.disconnect(); } catch {} throw err; }

    dev._hrWatched = true;
    dev.addEventListener('gattserverdisconnected', async () => {     // dropped out: try again a few times
      const was = hrm.dev === dev; hrm.dev = null; hrLabel();
      if (!was) return;

}

  if (!navigator.bluetooth) { hrLabel('Needs Chrome or Edge'); return; }
  if (hrm.busy) return;
  if (hrm.dev) { const d = hrm.dev; hrm.dev = null; hrm.tries = 99; try { d.gatt.disconnect(); } catch {} hrm.bpm = null; hrLabel(); return; }   // a second click disconnects
  hrm.busy = true;
  try {
    let last = null; try { last = JSON.parse(localStorage.getItem(HR_KEY)); } catch {}

        if (d.id !== last.id) continue;

        try { await useHrm(d); return; } catch (err) {}
      }
    }

    const dev = await navigator.bluetooth.requestDevice({ filters: [{ services: ['heart_rate'] }] });
    hrLabel('Heart rate: connecting…');

/* ---------- ride log: distance ridden, kept in this browser (localStorage) ---------- */
{
  const KEY = 'golden-hour-ride-log', MIN = 100;         // rides under 100 m are not kept

/* ---------- workouts: power targets step by step, read from MyWhoosh workout files ----------

   With ERG on and a trainer under control, the trainer holds the target power; otherwise it follows the road. */
const WO_KEY = 'golden-hour-ride-workouts', FTP_KEY = 'golden-hour-ride-ftp', ERG_KEY = 'golden-hour-ride-erg';
const keep = { get: (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
               set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } } };

  const force = st.power / Math.max(v, 2) - MASS * 9.81 * (slope + 0.004) - 0.5 * 1.2 * 0.32 * v * v - brake;
  st.v = Math.max(0.5, v + force / MASS * dt);
  if (SCENERY !== null) {
    st.v = v + (5 - v) * Math.min(1, dt);                 // a steady 18 km/h, whatever the gradient
    scene_t += dt;
    if (scene_t >= SCENE_PLAN[scene_i][1]) { scene_t = 0; scene_i = (scene_i + 1) % SCENE_PLAN.length; setWeather(SCENE_PLAN[scene_i][0]); }
  }
  st.s = (st.s + st.v * dt) % LEN; st.dist += st.v * dt;
  grade += (pose.t.y * 100 - grade) * Math.min(1, dt * 2);

  // camera: follow the lane, look down the road, lean into bends, rock with the pedals
  at(st.s, pose); at(st.s + 9, ahead); at(st.s + 4, probe);
  uMeadow.value.set(pose.p.x + pose.t.x * 78, pose.p.z + pose.t.z * 78);      // most of the meadow sits in front of you
  const kappa = -(pose.t.z * probe.t.x - pose.t.x * probe.t.z) / 4;
  lean += (Math.atan(st.v * st.v * kappa / 9.81) * 0.55 - lean) * Math.min(1, dt * 3);
  const effort = Math.min(1, st.power / 300);
  phase += dt * Math.PI * 2 * (st.power > 5 ? 60 + Math.min(40, st.power / 8) : 0) / 60;
  const sway = Math.sin(phase);
  camera.position.copy(pose.p).addScaledVector(pose.r, LANE + sway * 0.004 * effort);
  camera.position.y += 1.52;
  look.copy(ahead.p).addScaledVector(ahead.r, LANE); look.y += 0.3;
  camera.lookAt(look);
  camera.rotateZ(-lean);
  const fov = 62 + Math.min(st.v, 20) * 0.75;
  if (Math.abs(fov - camera.fov) > 0.01) { camera.fov = fov; camera.updateProjectionMatrix(); }

  stepWeather(dt);
  stepWorkout(dt);
  if (st.power >= 10) st.time += dt;                      // riding time: stops while you are not pedalling
  rainU.uVel.value.copy(pose.t).multiplyScalar(st.v);

  // sun shadow box travels with the rider, pushed forward into the view
  sun.target.position.copy(pose.p).addScaledVector(pose.t, 70);
  sun.position.copy(sun.target.position).addScaledVector(sunDir, 350);
  let built = false;
  for (const c of chunks) {
    const d2 = c.c.distanceToSquared(camera.position);
    if (d2 < 230 * 230) { if (!c.mesh && !built) { c.mesh = c.build(); built = true; } }
    else if (c.mesh && d2 > 330 * 330) { scene.remove(c.mesh); c.mesh.dispose(); c.mesh = null; }
  }

  sunNdc.copy(camera.position).addScaledVector(sunDir, 1000).project(camera);
  rays.uniforms.uSunUv.value.set(sunNdc.x * 0.5 + 0.5, sunNdc.y * 0.5 + 0.5);
  rays.uniforms.uAmt.value = 0.25 * wx.rays * smooth(0.1, 0.6, camera.getWorldDirection(fwd).dot(sunDir));
  lens.uniforms.uSpeed.value = Math.min(1, st.v / 22);
  lens.uniforms.uTime.value = uTime.value; lens.uniforms.uRain.value = wx.rain; lens.uniforms.uPaint.value = wx.paint;
  if (audio) {
    const t = audio.ac.currentTime;
    audio.wind.g.gain.setTargetAtTime(Math.min(0.5, st.v * st.v / 400 * 0.35) * coach.duck, t, 0.2);
    audio.wind.f.frequency.setTargetAtTime(300 + st.v * 40, t, 0.2);
    audio.tyre.g.gain.setTargetAtTime(Math.min(0.35, st.v / 15 * 0.25) * coach.duck, t, 0.2);
    audio.rain.g.gain.setTargetAtTime(wx.rain * 0.1 * coach.duck, t, 0.4);
  }

  huT -= dt;
  if (huT <= 0) {
    huT = 0.25;
    drawHeadUnit(st.v * 3.6, st.power);
    $('h-pw').textContent = st.power.toFixed(0);
    const cad = cadenceNow(); $('h-cad').textContent = cad === null ? '–' : cad;
    const hr = hrNow(); $('h-hrbox').hidden = !hrm.dev && hr === null; showHr($('h-hr'), hr);
    drawWorkout();
    $('h-sp').textContent = (st.v * 3.6).toFixed(1);
    $('h-gr').textContent = (grade >= 0 ? '+' : '') + grade.toFixed(1);
    $('h-di').textContent = (st.dist / 1000).toFixed(2);
    $('h-ti').textContent = mmss(st.time);
  }

  composer.render();
  coachFig.draw(dt);                                      // the coach window, drawn on top during workouts
  if (first) { first = false; $('loading').style.opacity = 0; setTimeout(() => $('loading').remove(), 900); }
  requestAnimationFrame(tick);
}
tick();
</script>
</body>
</html>
